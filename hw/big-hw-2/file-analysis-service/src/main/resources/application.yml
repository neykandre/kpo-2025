server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://analysis-db:5432/analysis_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

file-service:
  base-url: http://file-service:8080

quickchart:
  endpoint: https://quickchart.io/wordcloud

springdoc:
  swagger-ui.path: /swagger-ui.html
